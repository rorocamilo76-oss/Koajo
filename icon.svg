<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="110" fill="#0a0a0a"/>
  <!-- Rayos rojos -->
  <g stroke="#e74c3c" stroke-width="16" stroke-linecap="round" opacity="0.8">
    <line x1="256" y1="40" x2="256" y2="90"/>
    <line x1="256" y1="422" x2="256" y2="472"/>
    <line x1="40" y1="256" x2="90" y2="256"/>
    <line x1="422" y1="256" x2="472" y2="256"/>
    <line x1="88" y1="88" x2="123" y2="123"/>
    <line x1="389" y1="389" x2="424" y2="424"/>
    <line x1="424" y1="88" x2="389" y2="123"/>
    <line x1="123" y1="389" x2="88" y2="424"/>
  </g>
  <!-- Rayos verdes intermedios -->
  <g stroke="#2ecc71" stroke-width="10" stroke-linecap="round" opacity="0.5">
    <line x1="256" y1="55" x2="256" y2="85"/>
    <line x1="389" y1="123" x2="370" y2="142"/>
    <line x1="422" y1="256" x2="392" y2="256"/>
    <line x1="389" y1="389" x2="370" y2="370"/>
    <line x1="256" y1="427" x2="256" y2="457"/>
    <line x1="123" y1="389" x2="142" y2="370"/>
    <line x1="90" y1="256" x2="120" y2="256"/>
    <line x1="123" y1="123" x2="142" y2="142"/>
  </g>
  <!-- Círculo exterior -->
  <circle cx="256" cy="256" r="145" fill="none" stroke="#2ecc71" stroke-width="6" opacity="0.3"/>
  <!-- Sol degradado -->
  <defs>
    <radialGradient id="g1" cx="38%" cy="35%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="45%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#2ecc71"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="110" fill="url(#g1)"/>
  <!-- K -->
  <text x="256" y="305" font-family="Arial Black,sans-serif" font-size="110" font-weight="900" fill="#fff" text-anchor="middle" opacity="0.95">K</text>
</svg>
      
