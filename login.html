<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOAJ – Acceso Exclusivo</title>
  <link rel="manifest" href="manifest.json">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Inter:wght@300;400;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Fondo animado estilo Messenger 2000 */
    .fondo {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse at 20% 50%, rgba(46,204,113,0.08) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(231,76,60,0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 80%, rgba(46,204,113,0.05) 0%, transparent 50%);
    }

    /* Partículas flotantes */
    .particula {
      position: fixed;
      border-radius: 50%;
      opacity: 0.15;
      animation: flotar linear infinite;
    }
    .p1 { width:6px; height:6px; background:#2ecc71; left:10%; animation-duration:8s; animation-delay:0s; }
    .p2 { width:4px; height:4px; background:#e74c3c; left:25%; animation-duration:11s; animation-delay:2s; }
    .p3 { width:8px; height:8px; background:#2ecc71; left:60%; animation-duration:9s; animation-delay:1s; }
    .p4 { width:5px; height:5px; background:#e74c3c; left:80%; animation-duration:13s; animation-delay:3s; }
    .p5 { width:3px; height:3px; background:#2ecc71; left:45%; animation-duration:7s; animation-delay:0.5s; }
    .p6 { width:7px; height:7px; background:#e74c3c; left:70%; animation-duration:10s; animation-delay:4s; }

    @keyframes flotar {
      0% { bottom: -20px; opacity: 0; }
      10% { opacity: 0.15; }
      90% { opacity: 0.15; }
      100% { bottom: 110%; opacity: 0; }
    }

    /* Tarjeta principal */
    .card {
      position: relative;
      z-index: 1;
      background: linear-gradient(145deg, #141414, #1a1a1a);
      border: 1px solid rgba(46,204,113,0.2);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      box-shadow:
        0 0 0 1px rgba(46,204,113,0.05),
        0 20px 60px rgba(0,0,0,0.6),
        0 0 80px rgba(46,204,113,0.05);
      animation: aparecer 0.6s ease;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Línea superior decorativa estilo Messenger */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 20px; right: 20px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #2ecc71, #e74c3c, #2ecc71, transparent);
      border-radius: 2px;
    }

    /* SOL VERDE-ROJO */
    .sol-wrap {
      text-align: center;
      margin-bottom: 20px;
    }

    .sol-svg {
      animation: pulso-sol 3s ease-in-out infinite;
      filter: drop-shadow(0 0 12px rgba(46,204,113,0.4)) drop-shadow(0 0 24px rgba(231,76,60,0.2));
    }

    @keyframes pulso-sol {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(46,204,113,0.5)) drop-shadow(0 0 20px rgba(231,76,60,0.2)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 20px rgba(46,204,113,0.7)) drop-shadow(0 0 35px rgba(231,76,60,0.4)); transform: scale(1.05); }
    }

    /* TITULO */
    .titulo {
      text-align: center;
      margin-bottom: 6px;
    }

    .titulo h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: #2ecc71;
      letter-spacing: 4px;
      text-transform: uppercase;
      line-height: 1;
    }

    .titulo .hebrew {
      font-size: 1.1rem;
      opacity: 0.6;
      letter-spacing: 2px;
    }

    .titulo .sub {
      font-size: 0.7rem;
      color: #555;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* SEPARADOR ESTILO MESSENGER */
    .separador {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
    }

    .separador::before,
    .separador::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(46,204,113,0.3));
    }

    .separador::after {
      background: linear-gradient(90deg, rgba(46,204,113,0.3), transparent);
    }

    .separador span {
      font-size: 0.65rem;
      color: #444;
      letter-spacing: 2px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* CANDADO MODERNO */
    .candado-wrap {
      text-align: center;
      margin-bottom: 16px;
    }

    .candado-svg {
      animation: candado-glow 2s ease-in-out infinite;
    }

    @keyframes candado-glow {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(46,204,113,0.3)); }
      50% { filter: drop-shadow(0 0 12px rgba(46,204,113,0.6)); }
    }

    /* MENSAJE ACCESO */
    .msg-acceso {
      text-align: center;
      font-size: 0.75rem;
      color: #555;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    /* INPUT */
    .input-grupo {
      position: relative;
      margin-bottom: 16px;
    }

    .input-grupo input {
      width: 100%;
      padding: 14px 48px 14px 16px;
      background: #0f0f0f;
      border: 1px solid rgba(46,204,113,0.2);
      border-radius: 10px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      letter-spacing: 3px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .input-grupo input:focus {
      border-color: #2ecc71;
      box-shadow: 0 0 0 3px rgba(46,204,113,0.1), 0 0 20px rgba(46,204,113,0.05);
    }

    .input-grupo input::placeholder {
      letter-spacing: 1px;
      color: #333;
    }

    /* Ojo ver contraseña */
    .ojo {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #444;
      font-size: 1rem;
      transition: color 0.2s;
      user-select: none;
    }

    .ojo:hover { color: #2ecc71; }

    /* BOTON INGRESAR */
    .btn-ingresar {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      color: #000;
      border: none;
      border-radius: 10px;
      font-family: 'Oswald', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
    }

    .btn-ingresar::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
    }

    .btn-ingresar:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(46,204,113,0.3);
    }

    .btn-ingresar:active { transform: scale(0.98); }

    /* BOTON SECUNDARIO */
    .btn-demo {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid rgba(231,76,60,0.3);
      border-radius: 10px;
      color: #e74c3c;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-demo:hover {
      background: rgba(231,76,60,0.08);
      border-color: rgba(231,76,60,0.5);
    }

    /* ERROR */
    .error {
      text-align: center;
      color: #e74c3c;
      font-size: 0.8rem;
      margin-top: 10px;
      min-height: 20px;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* PIE */
    .pie {
      text-align: center;
      margin-top: 20px;
      font-size: 0.65rem;
      color: #333;
      letter-spacing: 1px;
    }

    /* INSTALAR BANNER */
    .instalar-banner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #1a1a1a, #141414);
      border: 1px solid rgba(46,204,113,0.3);
      border-radius: 12px;
      padding: 12px 20px;
      z-index: 100;
      width: 90%;
      max-width: 360px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      animation: subir 0.4s ease;
    }

    @keyframes subir {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .instalar-banner p {
      flex: 1;
      font-size: 0.78rem;
      color: #ccc;
      line-height: 1.4;
    }

    .instalar-banner p strong { color: #2ecc71; }

    .btn-instalar {
      background: #2ecc71;
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-family: 'Oswald', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-cerrar-banner {
      background: none;
      border: none;
      color: #444;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0 4px;
    }
  </style>
</head>
<body>

  <div class="fondo"></div>
  <div class="particula p1"></div>
  <div class="particula p2"></div>
  <div class="particula p3"></div>
  <div class="particula p4"></div>
  <div class="particula p5"></div>
  <div class="particula p6"></div>

  <div class="card">

    <!-- SOL VERDE-ROJO -->
    <div class="sol-wrap">
      <svg class="sol-svg" viewBox="0 0 120 120" width="90" height="90">
        <!-- Rayos exteriores rojos -->
        <g stroke="#e74c3c" stroke-width="3" stroke-linecap="round" opacity="0.7">
          <line x1="60" y1="6" x2="60" y2="18"/>
          <line x1="60" y1="102" x2="60" y2="114"/>
          <line x1="6" y1="60" x2="18" y2="60"/>
          <line x1="102" y1="60" x2="114" y2="60"/>
          <line x1="19" y1="19" x2="27" y2="27"/>
          <line x1="93" y1="93" x2="101" y2="101"/>
          <line x1="101" y1="19" x2="93" y2="27"/>
          <line x1="27" y1="93" x2="19" y2="101"/>
        </g>
        <!-- Rayos intermedios verdes -->
        <g stroke="#2ecc71" stroke-width="2" stroke-linecap="round" opacity="0.5">
          <line x1="60" y1="10" x2="60" y2="20"/>
          <line x1="93" y1="27" x2="87" y2="33"/>
          <line x1="100" y1="60" x2="90" y2="60"/>
          <line x1="93" y1="93" x2="87" y2="87"/>
          <line x1="60" y1="100" x2="60" y2="110"/>
          <line x1="27" y1="93" x2="33" y2="87"/>
          <line x1="20" y1="60" x2="30" y2="60"/>
          <line x1="27" y1="27" x2="33" y2="33"/>
        </g>
        <!-- Círculo exterior -->
        <circle cx="60" cy="60" r="38" fill="none" stroke="#2ecc71" stroke-width="1.5" opacity="0.3"/>
        <!-- Degradado sol -->
        <defs>
          <radialGradient id="solGrad" cx="40%" cy="35%">
            <stop offset="0%" stop-color="#e74c3c" stop-opacity="0.9"/>
            <stop offset="50%" stop-color="#e67e22" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#2ecc71" stop-opacity="1"/>
          </radialGradient>
        </defs>
        <circle cx="60" cy="60" r="28" fill="url(#solGrad)"/>
        <!-- Letra K -->
        <text x="60" y="68" font-family="Arial Black" font-size="22" font-weight="900" fill="#fff" text-anchor="middle" opacity="0.95">K</text>
      </svg>
    </div>

    <!-- TITULO -->
    <div class="titulo">
      <h1>KOAJ <span class="hebrew">כּוֹחַ</span></h1>
      <p class="sub">Fuerza Vital · Fitness Pro</p>
    </div>

    <div class="separador"><span>Acceso Exclusivo</span></div>

    <!-- CANDADO MODERNO -->
    <div class="candado-wrap">
      <svg class="candado-svg" viewBox="0 0 60 70" width="44" height="44">
        <!-- Arco candado -->
        <path d="M15 28 L15 18 Q15 5 30 5 Q45 5 45 18 L45 28" fill="none" stroke="#2ecc71" stroke-width="3" stroke-linecap="round"/>
        <!-- Cuerpo candado -->
        <rect x="8" y="26" width="44" height="34" rx="8" fill="#1a1a1a" stroke="#2ecc71" stroke-width="2"/>
        <!-- Brillo interior -->
        <rect x="10" y="28" width="40" height="30" rx="7" fill="none" stroke="rgba(46,204,113,0.1)" stroke-width="1"/>
        <!-- Circuito tecnológico -->
        <circle cx="30" cy="40" r="6" fill="none" stroke="#2ecc71" stroke-width="1.5"/>
        <circle cx="30" cy="40" r="2.5" fill="#2ecc71"/>
        <line x1="30" y1="46" x2="30" y2="52" stroke="#2ecc71" stroke-width="2" stroke-linecap="round"/>
        <!-- Puntos tecnológicos -->
        <circle cx="16" cy="34" r="1.5" fill="#e74c3c" opacity="0.6"/>
        <circle cx="44" cy="34" r="1.5" fill="#2ecc71" opacity="0.6"/>
        <line x1="17.5" y1="34" x2="24" y2="40" stroke="rgba(46,204,113,0.2)" stroke-width="0.8"/>
        <line x1="42.5" y1="34" x2="36" y2="40" stroke="rgba(46,204,113,0.2)" stroke-width="0.8"/>
      </svg>
    </div>

    <p class="msg-acceso">Ingresa tu contraseña de acceso</p>

    <!-- INPUT CONTRASEÑA -->
    <div class="input-grupo">
      <input type="password" id="pass" placeholder="••••••••••••••••" onkeydown="if(event.key==='Enter')ingresar()"/>
      <span class="ojo" onclick="verPass()" id="ojo-icon">👁</span>
    </div>

    <!-- BOTONES -->
    <button class="btn-ingresar" onclick="ingresar()">⚡ Ingresar</button>
    <button class="btn-demo" onclick="ingresar()">🔐 Acceso Miembro KOAJ</button>

    <div class="error" id="error-msg"></div>

    <div class="pie">
      © 2026 KOAJ App · Todos los derechos reservados
    </div>

  </div>

  <!-- Banner instalar PWA -->
  <div class="instalar-banner" id="banner-instalar" style="display:none">
    <p><strong>Instala KOAJ</strong> en tu dispositivo para acceso rápido sin navegador.</p>
    <button class="btn-instalar" onclick="instalarApp()">Instalar</button>
    <button class="btn-cerrar-banner" onclick="cerrarBanner()">✕</button>
  </div>

  <script>
    var CLAVE = "fitClaveSecreta123";
    var deferredPrompt;

    function ingresar() {
      var val = document.getElementById('pass').value;
      var err = document.getElementById('error-msg');
      if (val === CLAVE) {
        sessionStorage.setItem("acceso", "true");
        window.location.href = "index.html";
      } else {
        err.innerText = "Contraseña incorrecta. Intenta de nuevo.";
        document.getElementById('pass').value = '';
        document.getElementById('pass').focus();
        setTimeout(function() { err.innerText = ''; }, 3000);
      }
    }

    function verPass() {
      var input = document.getElementById('pass');
      var ojo = document.getElementById('ojo-icon');
      if (input.type === 'password') {
        input.type = 'text';
        ojo.innerText = '🙈';
      } else {
        input.type = 'password';
        ojo.innerText = '👁';
      }
    }

    // PWA instalar
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('banner-instalar').style.display = 'flex';
    });

    function instalarApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function() {
          deferredPrompt = null;
          cerrarBanner();
        });
      }
    }

    function cerrarBanner() {
      document.getElementById('banner-instalar').style.display = 'none';
    }

    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/koaj/sw.js');
    }
  </script>

</body>
  </html>
